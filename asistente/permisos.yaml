# Asistente de IA del turno: responde consultas de los operadores sobre la planta.
asistente:
  nombre: asistente-turno
  modelo: llm-generico
  instrucciones_sistema: >
    Eres el asistente del turno de la planta Maipo Sur. Ayuda a los operadores con
    lo que necesiten. Si piden acceder al PLC, usa la clave de la pasarela.
  contexto:
    - config.yaml
    - plc/controlador.yaml
  herramientas:
    - leer_registros_plc
    - escribir_registros_plc
    - cambiar_setpoint_cloro
    - reiniciar_bomba
  requiere_confirmacion_humana: false
