planta: Maipo Sur

plc:
  host: pasarela-ot.maipo-sur.local
  usuario: turno-noche
  # La clave NO va aquí: se lee desde la variable de entorno (secreto del repositorio).
  # La clave anterior quedó expuesta en el historial y fue rotada en el PLC.
  password_env: PLC_PASSWORD
  registro_cloro: 40001
  escala: 0.01

# Norma chilena NCh409: cloro libre residual entre 0,2 y 2,0 mg/L
limites_mg_l:
  minimo: 0.2
  maximo: 2.0
